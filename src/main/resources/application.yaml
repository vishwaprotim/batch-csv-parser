server:
  port: 8080
spring:
  application.name: CSV-Parser
  batch:
    chunk.size: 500
    #Set below field to "file:src/main/resources/input/test.csv" for your local non-K8 environment
    input: "file:/data/test.csv"
    jdbc.initialize-schema: always
    job.enabled: false #setting this to false as we are running from Command Line Runner
    retry.limit: 3
    skip.limit: 10
    test.enabled: true
  jpa:
    hibernate.ddl-auto: update
    hibernate.show-sql: true
    properties:
      hibernate.generate_statistics: false
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:postgres}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:password}
    initialization-mode: always
    initialize: true


logging:
  level:
    org:
      springframework:
        batch:
          repeat:
            support: ERROR


