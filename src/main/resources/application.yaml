server:
  port: 8080
spring:
  application.name: CSV-Parser
  batch:
    chunk.size: 500
    #input: "file:/data/test.csv" # Use this for K8s environment
    input: "file:src/main/resources/input/input.csv" # Use this for local non-K8s environment
    jdbc:
      initialize-schema: always
    job.enabled: false #setting this to false as we are running from Command Line Runner
    retry.limit: 3
    skip.limit: 10
    test.enabled: true
  jpa:
    hibernate.ddl-auto: update
    hibernate.show-sql: true
    properties:
      hibernate.generate_statistics: false
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:postgres}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    initialize: true
  sql:
    init:
      mode: always

logging:
  level:
    org:
      springframework:
        batch:
          repeat:
            support: ERROR
