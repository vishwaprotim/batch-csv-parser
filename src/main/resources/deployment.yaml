kind: Service
apiVersion: v1
metadata:
  name: csv-parser
  labels:
    name: csv-parser
spec:
  ports:
    - nodePort: 30163
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app: csv-parser
  type: NodePort

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: csv-parser
spec:
  selector:
    matchLabels:
      app: csv-parser
  replicas: 1
  template:
    metadata:
      labels:
        app: csv-parser
    spec:
      containers:
        - name: csv-parser
          image: csv-parser:1.0
          ports:
            - containerPort: 8080
          env:   # Setting Enviornmental Variables
            - name: DB_HOST   # Setting Database host address from configMap
              valueFrom:
                configMapKeyRef:
                  name: postgres-conf  # name of configMap
                  key: host
            - name: DB_NAME  # Setting Database name from configMap
              valueFrom:
                configMapKeyRef:
                  name: postgres-conf
                  key: name
            - name: POSTGRES_USER  # Setting Database username from Secret
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials # Secret Name
                  key: postgres_user
            - name: POSTGRES_PASSWORD # Setting Database password from Secret
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: postgres_password
          volumeMounts:
            - name: input-data
              mountPath: /data/
      volumes:
        - name: input-data
          hostPath:
            path: /data/



